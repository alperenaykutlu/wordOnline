# ════════════════════════════════════════════════
#   WORDLE ONLINE — Docker Compose
#   Kullanım: docker compose up -d
# ════════════════════════════════════════════════

services:

  # ── MongoDB ──────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: wordle_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS:-changeme}
      MONGO_INITDB_DATABASE: wordle_prod
    volumes:
      - mongo_data:/data/db
      - ./infra/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - wordle_net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: wordle_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-changeme}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
    volumes:
      - redis_data:/data
    networks:
      - wordle_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── RabbitMQ ──────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: wordle_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-wordle_app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-changeme}
      RABBITMQ_DEFAULT_VHOST: wordle
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - wordle_net
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Backend API ───────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wordle_api
    restart: unless-stopped
    ports:
      - "5000:5000"
      - "5001:5001"
    environment:
      ASPNETCORE_ENVIRONMENT: ${APP_ENV:-Production}
      JWT__SecretKey: ${JWT_SECRET_KEY}
      JWT__Issuer: wordle-online
      JWT__Audience: wordle-mobile
      MongoDB__ConnectionString: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASS:-changeme}@mongodb:27017/wordle_prod?authSource=admin
      MongoDB__DatabaseName: wordle_prod
      Redis__ConnectionString: redis:6379,password=${REDIS_PASSWORD:-changeme}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: ${RABBITMQ_USER:-wordle_app}
      RabbitMQ__Password: ${RABBITMQ_PASS:-changeme}
      Google__ClientId: ${GOOGLE_CLIENT_ID}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - wordle_net

# ── Volumes ─────────────────────────────────────────
volumes:
  mongo_data:
  redis_data:
  rabbitmq_data:

# ── Network ──────────────────────────────────────────
networks:
  wordle_net:
    driver: bridge
